[package]
name = "pizza-contract"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pizza-common = { path = "../../common", default-features = false }
freenet-stdlib = { workspace = true, features = ["contract"] }
serde.workspace = true
ciborium.workspace = true
# Contract only needs verification, not signing - no rand needed
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
thiserror.workspace = true
freenet-scaffold.workspace = true


[dev-dependencies]

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
